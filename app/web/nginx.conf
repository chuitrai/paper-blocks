server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header bảo mật cho trang tĩnh
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; frame-src 'self'; object-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    # PDF tải lên tối đa 20 MiB + phần bao multipart
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 1024;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        try_files $uri $uri/ /index.html;
        # JS/CSS đổi thường xuyên khi dev, nên bắt kiểm tra lại mỗi lần
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; frame-src 'self'; object-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
