apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "pb.selector" (dict "name" "web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pb.selector" (dict "name" "web" "root" .) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "pb.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "pb.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  type: {{ .Values.web.service.type }}
  {{- if eq .Values.web.service.type "NodePort" }}
  externalTrafficPolicy: {{ .Values.web.service.externalTrafficPolicy }}
  {{- end }}
  selector: {{- include "pb.selector" (dict "name" "web" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if eq .Values.web.service.type "NodePort" }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
