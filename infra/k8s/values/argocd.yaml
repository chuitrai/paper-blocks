# Values cho chart argo/argo-cd, tối giản để vừa worker 8 GB cùng Jenkins và ứng dụng.

# Tắt thành phần không dùng: Dex (SSO) và Notifications.
dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    # Phục vụ HTTP thường trên cổng 80 của server (TLS sẽ do Ingress đảm nhiệm ở phase 9).
    server.insecure: true

server:
  service:
    type: NodePort
    nodePortHttp: 30081
    nodePortHttps: 30444
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}

redis:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 100m, memory: 96Mi}

# ApplicationSet giữ bật: phase 6 (preview env theo PR) cần nó.
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
